<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 AI Chat Assistant - Interactive</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #10b981;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --warning: #f59e0b;
            --user-bg: #4f46e5;
            --ai-bg: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .status-badge.connected {
            background: rgba(16, 185, 129, 0.2);
            color: var(--secondary);
        }

        .api-input {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .api-input input {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-dark);
            color: var(--text-primary);
            font-size: 0.9rem;
            width: 300px;
        }

        .api-input input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--secondary); color: white; }
        .btn-secondary:hover { background: #059669; }
        .btn-demo { background: var(--warning); color: white; }

        /* Chat Container */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 1rem 2rem;
            overflow: hidden;
        }

        /* Chat Messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            display: flex;
            gap: 1rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .message.ai .message-avatar {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        .message.user .message-avatar {
            background: var(--user-bg);
        }

        .message-content {
            max-width: 70%;
            padding: 1rem;
            border-radius: 12px;
            line-height: 1.6;
        }

        .message.ai .message-content {
            background: var(--ai-bg);
            border: 1px solid var(--border);
            border-top-left-radius: 4px;
        }

        .message.user .message-content {
            background: var(--user-bg);
            border-top-right-radius: 4px;
        }

        .message-content pre {
            background: var(--bg-dark);
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 0.5rem 0;
            font-size: 0.85rem;
        }

        .message-content code {
            background: var(--bg-dark);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .message-content p {
            margin-bottom: 0.5rem;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 1rem;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Quick Actions */
        .quick-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            padding: 0.5rem 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            margin-bottom: 1rem;
        }

        .quick-action {
            padding: 0.4rem 0.8rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-secondary);
        }

        .quick-action:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Input Area */
        .input-area {
            display: flex;
            gap: 1rem;
            align-items: flex-end;
            padding-top: 1rem;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .input-wrapper textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 1rem;
            resize: none;
            min-height: 50px;
            max-height: 150px;
            font-family: inherit;
            line-height: 1.5;
        }

        .input-wrapper textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .input-wrapper textarea::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
        }

        .send-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
            transform: none;
        }

        /* Info Box */
        .info-box {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--primary);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                padding: 1rem;
            }

            .api-input {
                width: 100%;
            }

            .api-input input {
                flex: 1;
                width: auto;
            }

            .chat-container {
                padding: 1rem;
            }

            .message-content {
                max-width: 85%;
            }
        }

        /* Welcome Message */
        .welcome {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }

        .welcome h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .welcome p {
            margin-bottom: 1.5rem;
        }

        .welcome-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
        }

        .suggestion {
            padding: 0.5rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .suggestion:hover {
            background: var(--primary);
            border-color: var(--primary);
        }
    </style>
    <!-- OpenAI SDK -->
    <script src="https://cdn.jsdelivr.net/npm/openai@4.28.0/dist/openai.min.js"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <h1>🤖 AI Chat Assistant</h1>
            <span id="statusBadge" class="status-badge">OFFLINE</span>
        </div>
        <div class="api-input">
            <input type="password" id="apiKey" placeholder="OpenAI API Key (sk-...)" />
            <button class="btn btn-primary" onclick="connect()">🔗 Connect</button>
        </div>
    </header>

    <!-- Chat Container -->
    <div class="chat-container">
        <!-- Info Box -->
        <div class="info-box" id="infoBox">
            💡 <strong>Masukkan API Key OpenAI</strong> (sk-...) dan klik "Connect" untuk mulai.
            Dapatkan API key di: <a href="https://platform.openai.com/api-keys" target="_blank" style="color: var(--primary);">platform.openai.com</a>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions" id="quickActions" style="display: none;">
            <button class="quick-action" onclick="sendQuickAction('Buatkan Hello World program')">📝 Hello World</button>
            <button class="quick-action" onclick="sendQuickAction('Buatkan README untuk project ini')">📄 README</button>
            <button class="quick-action" onclick="sendQuickAction('Analisa kode Python saya')">🔍 Analisa</button>
            <button class="quick-action" onclick="sendQuickAction('Buatkan unit test')">🧪 Unit Test</button>
            <button class="quick-action" onclick="sendQuickAction('Scan security issues')">🔒 Security</button>
        </div>

        <!-- Messages -->
        <div class="chat-messages" id="chatMessages">
            <!-- Welcome -->
            <div class="welcome" id="welcomeMessage">
                <h2>👋 Hai! Saya AI Assistant</h2>
                <p>Masukkan API Key OpenHands Cloud di atas untuk memulai percakapan.</p>
                <div class="welcome-suggestions">
                    <span class="suggestion" onclick="showNeedApiKey()">Apa itu OpenHands?</span>
                    <span class="suggestion" onclick="showNeedApiKey()">Bantu saya buat aplikasi web</span>
                    <span class="suggestion" onclick="showNeedApiKey()">Cara pakai API</span>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea 
                    id="messageInput" 
                    placeholder="Ketik pesan Anda di sini..."
                    rows="1"
                    onkeydown="handleKeyDown(event)"
                    oninput="autoResize(this)"
                ></textarea>
            </div>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        // State
        let isConnected = false;
        let messageHistory = [];
        let isTyping = false;

        // DOM Elements
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusBadge = document.getElementById('statusBadge');
        const quickActions = document.getElementById('quickActions');
        const infoBox = document.getElementById('infoBox');
        const welcomeMessage = document.getElementById('welcomeMessage');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('openhands_api_key');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
            }
            messageInput.focus();
        });

        // Auto resize textarea
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
        }

        // Handle Enter key
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // Connect to OpenAI API
        function connect() {
            const apiKey = document.getElementById('apiKey').value.trim();
            
            if (!apiKey) {
                showInfo('⚠️ Masukkan API Key terlebih dahulu!', 'warning');
                return;
            }

            if (!apiKey.startsWith('sk-')) {
                showInfo('⚠️ API Key harus dimulai dengan "sk-" (OpenAI)', 'warning');
                return;
            }

            localStorage.setItem('openhands_api_key', apiKey);
            isConnected = true;
            
            statusBadge.textContent = 'CONNECTED';
            statusBadge.classList.add('connected');
            quickActions.style.display = 'flex';
            
            showInfo('✅ Berhasil terhubung ke OpenAI!', 'success');
            
            // Remove welcome message
            if (welcomeMessage) {
                welcomeMessage.style.display = 'none';
            }
            
            // Add welcome message from AI
            addMessage('ai', '👋 Selamat datang! Saya siap membantu Anda.\n\nApa yang bisa saya bantu hari ini?');
        }

        // Show need API key message
        function showNeedApiKey() {
            showInfo('⚠️ Masukkan API Key terlebih dahulu untuk menggunakan fitur ini!', 'warning');
        }

        // Show Info Message
        function showInfo(text, type = 'info') {
            infoBox.innerHTML = text;
            if (type === 'success') {
                infoBox.style.borderColor = 'var(--secondary)';
                infoBox.style.background = 'rgba(16, 185, 129, 0.1)';
            } else if (type === 'warning') {
                infoBox.style.borderColor = 'var(--warning)';
                infoBox.style.background = 'rgba(245, 158, 11, 0.1)';
            } else {
                infoBox.style.borderColor = 'var(--primary)';
                infoBox.style.background = 'rgba(99, 102, 241, 0.1)';
            }
        }

        // Add Message
        function addMessage(role, content) {
            const avatar = role === 'ai' ? '🤖' : '👤';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            // Convert markdown-like text to HTML
            const formattedContent = formatContent(content);
            
            messageDiv.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">${formattedContent}</div>
            `;
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Format Content (simple markdown)
        function formatContent(content) {
            return content
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/\n/g, '<br>');
        }

        // Show Typing Indicator
        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Hide Typing Indicator
        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        // Send Quick Action
        function sendQuickAction(text) {
            document.getElementById('messageInput').value = text;
            sendMessage();
        }

        // Send Message
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || isTyping) return;
            
            if (!isConnected) {
                showInfo('⚠️ Hubungkan ke OpenHands Cloud terlebih dahulu!', 'warning');
                return;
            }

            // Clear input
            messageInput.value = '';
            messageInput.style.height = 'auto';

            // Add user message
            addMessage('user', text);
            messageHistory.push({ role: 'user', content: text });

            // Show typing
            isTyping = true;
            sendBtn.disabled = true;
            showTyping();

            try {
                let response;
                
                // Try API call
                response = await callOpenHandsAPI(text);

                hideTyping();
                addMessage('ai', response);
                messageHistory.push({ role: 'ai', content: response });

            } catch (error) {
                hideTyping();
                addMessage('ai', '❌ Maaf, terjadi error saat memproses request: ' + error.message + '\n\nSilakan coba lagi.');
            }

            isTyping = false;
            sendBtn.disabled = false;
            messageInput.focus();
        }

        // Call OpenAI API using SDK
        async function callOpenHandsAPI(message) {
            const apiKey = localStorage.getItem('openhands_api_key');
            
            try {
                // Using OpenAI SDK
                const client = new OpenAI({ apiKey: apiKey, dangerouslyAllowBrowser: true });
                
                const response = await client.chat.completions.create({
                    model: 'gpt-3.5-turbo',
                    messages: [
                        ...messageHistory.map(m => ({ role: m.role, content: m.content })),
                        { role: 'user', content: message }
                    ],
                    max_tokens: 1000
                });

                return response.choices[0]?.message?.content || 'No response';
                
            } catch (error) {
                throw new Error(error.message || 'Failed to connect to OpenAI');
            }
        }
    </script>
</body>
</html>
